<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <header>
        <nav class="bg-green-800">
            <div class="flex flex-wrap items-center">
                <a href="index.html" class="home text-white">
                    <img src="Images/Logogroen.png" class="h-24" alt="logo">
                </a>
                <ul class="font-medium flex items-center flex-1 mr-12 gap-3">
                    <li>
                        <a href="#" class="block py-2 px-8 text-white text-2xl" aria-current="page">Adminpanel</a>
                    </li>
                    <li>
                        <a href="#"
                            class="block py-2 px-8 text-white text-medium rounded-full hover:bg-gray-800">Orders</a>
                    </li>
                    <li>
                        <a href="toevoegen.html"
                            class="block py-2 px-8 text-white text-medium rounded-full bg-gray-950 hover:bg-gray-800">Product
                            Toevoegen</a>
                    </li>
                    <li>
                        <a href="admin-beheer.html"
                            class="block py-2 px-8 text-white text-medium rounded-full hover:bg-gray-800">Producten
                            Beheren</a>
                    </li>
                    <li class="ml-auto">
                        <a href="index.html"
                            class="block py-2 px-8 text-white text-medium bg-gray-950 rounded-full hover:bg-gray-800">Uitloggen</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="max-w-xl mx-auto my-10 p-8 bg-white rounded-2xl shadow-md border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Nieuw Product Toevoegen</h2>

        <form id="productForm" class="flex flex-col gap-5 text-base">
            <div>
                <label for="artist" class="block font-semibold text-gray-700 mb-1.5">Artiest</label>
                <input type="text" id="artist" placeholder="bijv. Billie Eilish" required
                    class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800 focus:border-transparent transition">
            </div>

            <div>
                <label for="album" class="block font-semibold text-gray-700 mb-1.5">Album</label>
                <input type="text" id="album" placeholder="bijv. Hit Me Hard and Soft" required
                    class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800 focus:border-transparent transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="price" class="block font-semibold text-gray-700 mb-1.5">Prijs</label>
                    <input type="text" id="price" placeholder="€19.99" required
                        class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800 focus:border-transparent transition">
                </div>

                <div>
                    <label for="format" class="block font-semibold text-gray-700 mb-1.5">Formaat</label>
                    <input type="text" id="format" placeholder="Vinyl, CD..." required
                        class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800 focus:border-transparent transition">
                </div>
            </div>

            <div>
                <label for="image_url" class="block font-semibold text-gray-700 mb-1.5">Afbeelding pad</label>
                <input type="text" id="image_url" placeholder="images/album.png" required
                    class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-800 focus:border-transparent transition">
            </div>

            <input type="submit" value="Voeg Artiest Toe"
                class="mt-2 p-3.5 bg-green-800 text-white font-semibold text-lg rounded-xl cursor-pointer hover:bg-green-900 active:scale-[0.99] transition shadow-md">
        </form>
    </div>
    <script src="toevoegen.js" defer></script>

</body>

</html>
